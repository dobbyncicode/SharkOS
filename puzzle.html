<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📬 You have a message</title>
  <link rel="stylesheet" href="css/sharkos.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .puzzle-container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
    }
    .puzzle-emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .puzzle-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .puzzle-clue {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .puzzle-clue .hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .puzzle-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      text-align: center;
      font-size: 15px;
      margin-top: 16px;
      transition: border-color 0.2s;
    }
    .puzzle-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .puzzle-input::placeholder {
      color: var(--text-faint);
    }
    .puzzle-result {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .puzzle-result.correct {
      background: rgba(40, 200, 64, 0.1);
      border: 1px solid rgba(40, 200, 64, 0.3);
      color: #28c840;
    }
    .puzzle-result.wrong {
      background: rgba(255, 95, 87, 0.1);
      border: 1px solid rgba(255, 95, 87, 0.3);
      color: #ff5f57;
    }
    .puzzle-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .puzzle-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="puzzle-container">
    <div class="puzzle-emoji">🦈</div>
    <div class="puzzle-title">Gift</div>

    <div class="puzzle-clue">
      <div class="hint">Clue 1</div>
      <p>🦈</p>
    </div>

    <div class="puzzle-clue">
      <div class="hint">Clue 2</div>
      <p>Operating System (short)</p>
    </div>

    <div class="puzzle-clue">
      <div class="hint">Clue 3</div>
      <p>1 + 2 = ?</p>
    </div>

    <input type="text" class="puzzle-input" id="answer" placeholder="Type the answer...">
    <div class="puzzle-result" id="result"></div>
  </div>

  <script>
    const input = document.getElementById('answer');
    const result = document.getElementById('result');

    input.addEventListener('keyup', (e) => {
      const val = e.target.value.toLowerCase().trim();
      const noSpace = val.replace(' ', '');

      if (val === 'sharkos') {
        result.className = 'puzzle-result correct';
        result.style.display = 'block';
        result.innerHTML = 'Correct! <a href="https://dobbyncicode.github.io/SharkOS/" class="puzzle-link" target="_blank">Open SharkOS →</a>';
      } else if (noSpace === 'sharkos' && val.includes(' ')) {
        result.className = 'puzzle-result wrong';
        result.style.display = 'block';
        result.textContent = 'Malapit! Try w/o space';
      } else if (val.length > 0) {
        result.className = 'puzzle-result wrong';
        result.style.display = 'block';
        result.textContent = 'Try again';
      } else {
        result.style.display = 'none';
      }
    });
  </script>
</body>
</html>
