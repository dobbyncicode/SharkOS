<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-config="app.name">SharkOS</title>
  <link rel="stylesheet" href="css/sharkos.css">
</head>
<body>

  <div id="wallpaper"></div>

  <div id="menu-bar">
    <div class="menu-left">
      <span class="menu-logo">🦈</span>
      <span class="menu-app-name" data-config="app.name">SharkOS</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Window</span>
      <span class="menu-item">Help</span>
    </div>
    <div class="menu-right">
      <span class="menu-icon">🔊</span>
      <span class="menu-icon">📶</span>
      <span class="menu-icon">🔋</span>
      <span class="menu-clock" id="menu-clock">12:00 PM</span>
    </div>
  </div>

  <div id="desktop">
    <div class="widget" id="clock-widget">
      <div class="widget-time" id="widget-time">12:00</div>
      <div class="widget-date" id="widget-date">April 27, 2026</div>
    </div>

    <div id="desktop-icons"></div>

    <div id="windows"></div>
  </div>

  <div id="dock">
    <div id="dock-container"></div>
  </div>

  <script src="js/sharkos.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
