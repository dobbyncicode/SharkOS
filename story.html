  #ascii-layer { color: #bbb; z-index: 1; }
  #text-layer {

    text-shadow: 0 0 8px rgba(255,255,255,0.2);

  #speaker {

  }

  #dialogue {

  }

    z-index: 3;

    left: 50%;

    gap: 10px;

    text-align: left;

    letter-spacing: 0.5px;

  }

  }

  }

    margin-right: 6px;
  }

    background: #000;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #title-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #ff6b9d;
    text-align: center;

// ============================================================
//  PARTICLES
// ============================================================

function initParticles() {
  const canvas = document.getElementById('particles');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  Game.particleCtx = canvas.getContext('2d');

  const colors = ['#ff6b9d', '#ffe066', '#ff9dc0', '#fff', '#ffd4e5'];
  Game.particles = [];

  for (let i = 0; i < 25; i++) {
    Game.particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speedY: -(Math.random() * 0.4 + 0.15),
      speedX: (Math.random() - 0.5) * 0.25,
      opacity: Math.random() * 0.4 + 0.1,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI * 2
    });
  }

  Game.particleInterval = setInterval(updateParticles, 50);
}

function updateParticles() {
  if (!Game.particleCtx) return;
  const canvas = document.getElementById('particles');
  const ctx = Game.particleCtx;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of Game.particles) {
    p.y += p.speedY;
    p.x += p.speedX;
    p.pulse += 0.02;

    if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
    if (p.x < -5) p.x = canvas.width + 5;
    if (p.x > canvas.width + 5) p.x = -5;

    const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  ENGINE
// ============================================================

function startGame() {
  const titleScreen = document.getElementById('title-screen');
  titleScreen.style.opacity = '0';
  setTimeout(() => {
    titleScreen.style.display = 'none';
    initParticles();
    loadScene(0);
  }, 1000);
}

function loadScene(sceneIndex) {
  if (sceneIndex >= story.length) return;
  Game.currentScene = sceneIndex;
  Game.currentLine = 0;
  Game.choicesVisible = false;
  Game.waitingForContinue = false;

  const scene = story[sceneIndex];
  document.getElementById('ascii-layer').textContent = scene.bg;
  showLine();
}

function showLine() {
  const scene = story[Game.currentScene];
  if (!scene || !scene.lines) return;

  if (Game.currentLine >= scene.lines.length) {
    if (scene.choices) {
      showChoices();
    } else if (scene.next) {
      Game.waitingForContinue = true;
    } else {
      Game.waitingForContinue = true;
    }
    return;
  }

  const line = scene.lines[Game.currentLine];
  typeText(line.speaker, line.text);
}

function typeText(speaker, text) {
  Game.typing = true;
  Game.waitingForContinue = false;

  document.getElementById('speaker').textContent = speaker + ':';
  const dialogueEl = document.getElementById('dialogue');
  dialogueEl.textContent = '';

  let i = 0;
  clearInterval(Game.typeTimer);
  Game.typeTimer = setInterval(() => {
    if (i < text.length) {
      dialogueEl.textContent += text[i];
      i++;
    } else {
      clearInterval(Game.typeTimer);
      Game.typing = false;
      Game.waitingForContinue = true;
    }
  }, 25);
}

function showChoices() {
  const scene = story[Game.currentScene];
  Game.choicesVisible = true;
  Game.selectedChoice = 0;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  scene.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="key-hint">[${i + 1}]</span> ${choice.text}`;
    btn.onclick = (e) => { e.stopPropagation(); pickChoice(i); };
    btn.onmouseenter = () => { Game.selectedChoice = i; updateChoiceSelection(); };
    choicesEl.appendChild(btn);
  });

  updateChoiceSelection();
}

function updateChoiceSelection() {
  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === Game.selectedChoice);
  });
}

function pickChoice(index) {
  const scene = story[Game.currentScene];
  const choice = scene.choices[index];
  if (!choice) return;

  Game.affection += choice.affection || 0;
  Game.choicesVisible = false;
  document.getElementById('choices').innerHTML = '';

  const nextIndex = findSceneIndex(choice.next);
  if (nextIndex !== -1) {
    transitionTo(nextIndex);
  }
}

function findSceneIndex(sceneId) {
  return story.findIndex(s => s.id === sceneId);
}

function transitionTo(sceneIndex) {
  const fade = document.getElementById('fade-layer');
  fade.style.opacity = '1';

  setTimeout(() => {
    loadScene(sceneIndex);
    fade.style.opacity = '0';
  }, 650);
}

function advance() {
  if (Game.typing) {
    clearInterval(Game.typeTimer);
    const scene = story[Game.currentScene];
    const line = scene.lines[Game.currentLine];
    document.getElementById('dialogue').textContent = line.text;
    Game.typing = false;
    Game.waitingForContinue = true;
    return;
  }

  if (!Game.waitingForContinue || Game.choicesVisible) return;

  const scene = story[Game.currentScene];
  Game.currentLine++;
  Game.waitingForContinue = false;

  if (Game.currentLine >= scene.lines.length) {
    if (scene.choices) {
      showChoices();
    } else if (scene.next) {
      const nextIndex = findSceneIndex(scene.next);
      if (nextIndex !== -1) transitionTo(nextIndex);
    } else {
      Game.waitingForContinue = false;
    }
  } else {
    showLine();
  }
}

// ============================================================
//  INPUT — Keyboard + Touch
// ============================================================

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    advance();
  }

  if (Game.choicesVisible) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      Game.selectedChoice = Math.max(0, Game.selectedChoice - 1);
      updateChoiceSelection();
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      e.preventDefault();
      const scene = story[Game.currentScene];
      Game.selectedChoice = Math.min(scene.choices.length - 1, Game.selectedChoice + 1);
      updateChoiceSelection();
    }
    if (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3' || e.code === 'Digit4') {
      const idx = parseInt(e.code.replace('Digit', '')) - 1;
      pickChoice(idx);
    }
  }
});

// Touch and click support
let touchStartY = 0;
let touchStartX = 0;

document.getElementById('screen').addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('screen').addEventListener('touchend', (e) => {
  const touchEndY = e.changedTouches[0].clientY;
  const touchEndX = e.changedTouches[0].clientX;
  const diffY = touchEndY - touchStartY;
  const diffX = touchEndX - touchStartX;

  // Swipe detection
  if (Math.abs(diffY) > 50 && Math.abs(diffY) > Math.abs(diffX)) {
    if (diffY < 0 && Game.choicesVisible) {
      // Swipe up
      Game.selectedChoice = Math.max(0, Game.selectedChoice - 1);
      updateChoiceSelection();
    } else if (diffY > 0 && Game.choicesVisible) {
      // Swipe down
      const scene = story[Game.currentScene];
      Game.selectedChoice = Math.min(scene.choices.length - 1, Game.selectedChoice + 1);
      updateChoiceSelection();
    }
  } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
    // Tap
    if (!Game.choicesVisible) {
      advance();
    }
  }
}, { passive: true });

document.getElementById('screen').addEventListener('click', (e) => {
  if (!Game.choicesVisible && e.target.tagName !== 'BUTTON') {
    advance();
  }
});
</script>
