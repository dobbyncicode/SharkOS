<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'VT323', 'Courier New', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  #screen {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    max-height: 100vh;
    background: #0a0a0a;
    border: 2px solid #333;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255, 100, 150, 0.08);
  }

  #ascii-layer, #text-layer, #choice-layer, #fade-layer {
    position: absolute;
    inset: 0;
    padding: 20px 30px;
    white-space: pre;
    font-size: clamp(9px, 1.4vw, 16px);
    line-height: 1.3;
    letter-spacing: 0.5px;
  }

  #ascii-layer { color: #bbb; z-index: 1; }
  #text-layer {
    z-index: 2;
    bottom: 0;
    top: auto;
    padding: 15px 30px 20px 30px;
    color: #eee;
    text-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  #speaker {
    color: #ff6b9d;
    font-weight: bold;
    font-size: clamp(11px, 1.6vw, 18px);
  }

  #dialogue {
    min-height: 3.5em;
    color: #ddd;
  }

  #choices {
    position: absolute;
    z-index: 3;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 340px;
  }

  .choice-btn {
    background: rgba(10, 10, 30, 0.92);
    border: 1px solid #ff6b9d;
    color: #eee;
    font-family: 'VT323', 'Courier New', monospace;
    font-size: clamp(13px, 1.8vw, 20px);
    padding: 12px 24px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    position: relative;
    letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
  }

  .choice-btn::before {
    content: '▶ ';
    color: #ff6b9d;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .choice-btn:hover, .choice-btn.selected, .choice-btn:active {
    background: rgba(255, 107, 157, 0.12);
    border-color: #ff9dc0;
    padding-left: 32px;
  }

  .choice-btn:hover::before, .choice-btn.selected::before, .choice-btn:active::before {
    opacity: 1;
  }

  .choice-btn .key-hint {
    color: #ff6b9d;
    margin-right: 6px;
  }

  #fade-layer {
    background: #000;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #title-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    color: #ff6b9d;
    text-align: center;
    transition: opacity 1s ease;
    padding: 20px;
  }

  #title-screen h1 {
    font-size: clamp(24px, 5vw, 52px);
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,107,157,0.4);
    margin-bottom: 8px;
  }

  #title-screen .subtitle {
    color: #666;
    font-size: clamp(12px, 2vw, 18px);
    margin-bottom: 30px;
  }

  #start-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid #ff6b9d;
    color: #ff6b9d;
    font-family: 'VT323', monospace;
    font-size: clamp(16px, 2.5vw, 24px);
    padding: 14px 36px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  #start-btn:hover, #start-btn:active {
    background: rgba(255,107,157,0.12);
    transform: translateY(-2px);
  }

  #continue-hint {
    position: absolute;
    bottom: 8px;
    right: 16px;
    z-index: 4;
    color: #444;
    font-size: clamp(10px, 1.3vw, 14px);
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .heart { color: #ff6b9d; }
  .star { color: #ffe066; }
  .nature { color: #6bcb77; }
  .water { color: #4d96ff; }
  .fire { color: #ff8c42; }

  #particles {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  #pet-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
  }

  .pet-run {
    position: absolute;
    font-size: 14px;
    white-space: pre;
    line-height: 1;
    opacity: 0.5;
  }

  /* Mobile */
  @media (max-width: 600px) {
    #screen {
      border: none;
      border-radius: 0;
      max-width: 100%;
      aspect-ratio: auto;
      height: 100vh;
    }

    #ascii-layer, #text-layer, #choice-layer, #fade-layer {
      padding: 12px 16px;
      font-size: clamp(8px, 2.5vw, 12px);
    }

    #text-layer {
      padding: 10px 16px 14px 16px;
    }

    #choices {
      min-width: 260px;
      width: calc(100% - 32px);
    }

    .choice-btn {
      padding: 14px 20px;
      font-size: clamp(14px, 4vw, 18px);
    }

    #title-screen h1 {
      font-size: clamp(20px, 6vw, 36px);
    }

    #title-screen .subtitle {
      font-size: clamp(11px, 3vw, 14px);
      margin-bottom: 20px;
    }

    #start-btn {
      padding: 16px 32px;
      font-size: clamp(16px, 5vw, 22px);
    }

    .pet-run {
      font-size: 10px;
    }
  }
</style>
</head>
<body>
<div id="screen">
  <div id="title-screen">
    <h1>Our Story</h1>
    <div class="subtitle">based on true events with artistic elements</div>
    <button id="start-btn" onclick="startGame()">Begin</button>
  </div>

  <canvas id="particles"></canvas>
  <div id="pet-layer"></div>
  <pre id="ascii-layer"></pre>
  <div id="text-layer">
    <div id="speaker"></div>
    <div id="dialogue"></div>
  </div>
  <div id="choices"></div>
  <div id="continue-hint">tap / space to continue</div>
  <div id="fade-layer"></div>
</div>

<script>
// ============================================================
//  OUR STORY
//  A three-act interactive ASCII love story
//  Based on true events with artistic elements
// ============================================================

const Game = {
  currentScene: 0,
  currentLine: 0,
  typing: false,
  typeTimer: null,
  selectedChoice: 0,
  choicesVisible: false,
  waitingForContinue: false,
  affection: 0,
  particles: [],
  particleCtx: null,
  particleInterval: null,
  petInterval: null
};

// ============================================================
//  ACT I — THE SPARK
//  A casual message. A bad night. A choice to stay.
// ============================================================

// ============================================================
//  ACT I — THE SPARK
//  She opens the door. He stays.
// ============================================================

const act1 = [
  {
    id: "bpo_night",
    bg: `
    ~        THE BPO        ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    .*..*....*..*...*...*..*.
    ....*...*..*...*..*...*..
    .*..*....*..*...*...*..*.
    +-----------------------+
    |   []  []  []          |
    |   []  []  []          |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    ....*...*..*...*..*...*..
`,

    lines: [
      { speaker: "Narrator", text: "Eleven forty-seven on a Tuesday. The BPO hums its own small weather — hold music, dial tones, the low static of people pretending their headsets are rooms." },
      { speaker: "Narrator", text: "You are on-site. Tech support, part-time, slotted between nursing classes. He is four towns away at his own desk in Bulacan, an outbound dialer specialist, spending eight hours a day being hung up on by strangers." },
      { speaker: "Narrator", text: "Same company. Same logo on the lanyard. The closest thing either of you has to a friendship is a 'hi' in the team channel and a thumbs-up nobody has ever explained." },
      { speaker: "Narrator", text: "Tonight, you decide to be the one who breaks it." }
    ],
    next: "first_message"
  },
  {
    id: "first_message",
    bg: `
    ~     MS TEAMS 11PM     ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    | Her                .  |
    | --------------------- |
    | what do you think     |
    | of this?              |
    |                       |
    | Him                   |
    | --------------------- |
    | of what lol           |
    |                       |
    | Her                .  |
    | --------------------- |
    | [screenshot]        . |
    | be serious            |
    |                       |
    | typing...           . |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "You open MS Teams because you need to say something to a human who is not being paid to be kind to you." },
      { speaker: "Narrator", text: "'What do you think of this?' you type. Nothing heavy. A screenshot. A half-formed opinion. The kind of message you send when you want a door to open, not a conversation." },
      { speaker: "Narrator", text: "It takes him four minutes. 'of what lol' — and something about that 'lol' makes you laugh out loud in an office you have been quietly drowning in for months." },
      { speaker: "Narrator", text: "So you send another. And another. Somewhere around message nine the screenshot stops mattering. By message forty you are telling him things you have not told anyone." }
    ],
    next: "the_logout"
  },
  {
    id: "the_logout",
    bg: `
    ~    THE ALL-NIGHTER    ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    *...*....*...*..*...*..*.
    ....*...*..*...*....*..* 
    ..*...*....*...*..*...*..
    +-----------------------+
    | he closes the         |
    | dialer at 12:04       |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
              .   |   .      
            .     |     .    
          ~~~~~~~~~~~~~~~    
               sunrise       
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "Somewhere past midnight you say the thing you have been circling all evening. Not all of it. Just enough that he would know." },
      { speaker: "Narrator", text: "He does not ask what you mean. He does not offer advice, or a solution, or a single piece of advice anyone else would have given you. He just closes his dialer, logs out of his shift, and stays." },
      { speaker: "Narrator", text: "You find out much later that he was on a streak. That his supervisor needed him. That he chose you over a number on a dashboard, and has never once mentioned it." },
      { speaker: "Narrator", text: "You talked. And talked. And talked. And somewhere in the dark, something sparked — small, and quiet, and impossible to pretend was nothing." },
      { speaker: "Narrator", text: "Toward morning he said goodnight. The sun was already up. Neither of you wanted to be the first one to hang up." }
    ],
    next: "confession"
  }
];

// ============================================================
//  ACT II — THE CHOICE
//  She asks. He answers. She sets the date.
// ============================================================

const act2 = [
  {
    id: "confession",
    bg: `
    ~    THE CONFESSION     ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    .    *    .    *    .    
      .    . * .    .  *     
    .    *    .    *    .    
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    | say it.               |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "It could have ended there. You could have let it stay a nice thing that happened at midnight, and gone to work, and never mentioned it again." },
      { speaker: "Narrator", text: "You did not." },
      { speaker: "Her", text: "You keep almost saying it. Say it." },
      { speaker: "Narrator", text: "He says he is not going to. He is lying. You both know he is lying, and you wait him out the way you wait out a patient who does not want the news yet." },
      { speaker: "Him", text: "I don't know how to say this without sounding weird. But you're the only good part of my day. I close my dialer early and you're the reason I don't mind. That's it. That's the whole thing." },
      { speaker: "Narrator", text: "He says it badly and fast, like a man stepping off a ledge. Then he goes quiet, and waits for you to decide whether to catch him." },
      { speaker: "Narrator", text: "You catch him." }
    ],
    next: "september"
  },
  {
    id: "september",
    bg: `
    ~  SEPTEMBER 28, 2024   ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    |                       |
    |    IT'S OFFICIAL.     |
    |                       |
    |    a saturday         |
    |    a date you set     |
    |    and he said yes    |
    |    before you         |
    |    finished the       |
    |    sentence           |
    |                       |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "September 28, 2024. A Saturday. You pick the date, because if you leave it to him he will wait another year out of pure politeness." },
      { speaker: "Narrator", text: "You tell him you are not going to be a secret. He says okay. He says it far too fast, the way people do when they are afraid of being believed." },
      { speaker: "Narrator", text: "You are a Swiftie. Taylor covered 'September' — the one about friends turning into something else. You told him it felt like a sign. He thought you were being ridiculous." },
      { speaker: "Narrator", text: "He also thought it every single day after." },
      { speaker: "Narrator", text: "He was shy, and broke, and certain he was not enough. You were stubborn, and certain, and right. That is the entire mechanic of this relationship." }
    ],
    next: "the_push"
  },
  {
    id: "the_push",
    bg: `
    ~     THE LONG PUSH     ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    | Her                   |
    | we should meet        |
    |                       |
    | Him                   |
    | not yet               |
    |                       |
    | Her                   |
    | when                  |
    |                       |
    | Him                   |
    | i don't know          |
    |                       |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "For months you ask to meet. For months he says not yet — too shy, too broke, too certain that being looked at directly will ruin the only good thing he has." },
      { speaker: "Narrator", text: "He has an entire vocabulary for not yet. He is fluent in it. He can say it in four languages, and none of them are the one you are waiting for." },
      { speaker: "Narrator", text: "You do not argue. You just ask again the next day. And the next. Until asking stops being a request and becomes the shape your week takes." },
      { speaker: "Narrator", text: "He stops saying no. He starts saying 'when'. Then one Tuesday he simply sends a time." }
    ],
    next: "kamuning"
  },
  {
    id: "kamuning",
    bg: `
    ~     GMA KAMUNING      ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
      |    |  |    |  |      
    __|____|__|____|__|___   
    ~~~~~~~~~~~~~~~~~~~~~~~~~
         both of you early   
         neither admits it   
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "GMA Kamuning station. You ride the MRT up from Paranaque. He rides out from Bulacan. For eleven weeks this was impossible, and then one Tuesday it is only a train ride." },
      { speaker: "Narrator", text: "You get there first. So does he. You both stand on opposite sides of the same platform pretending you did not both come early, and did not both check your phone eleven times." },
      { speaker: "Narrator", text: "He is wearing the shirt he thought about for an hour. You are holding a bag you packed absolutely nothing interesting into. Neither of you says anything for about four seconds." },
      { speaker: "Narrator", text: "Then you eat Jollibee, because one of you has to go first, and Jollibee was the easy part. After that you go to Bulacan, and you stay a few days, and it stops being a story you are reading." }
    ],
    next: "two_years"
  },
  {
    id: "two_years",
    bg: `
    ~    TWO YEARS LATER    ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
        ups      downs       
      . * . * .  ~ ~ ~ ~ ~   
       ~ ~ ~ ~ ~  *  .  *  . 
    ~~~~~~~~~~~~~~~~~~~~~~~~~
     late nights guinea pigs 
    *  *  *  *  _  _  _  _   
     .  .  .  .  ( )( )( )   
    ~~~~~~~~~~~~~~~~~~~~~~~~~
      still here             
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "Two years. Give or take a day — you are both terrible at math about this." },
      { speaker: "Narrator", text: "You finished nursing. You are an RN now, on your own two feet, in a building that runs on your particular kind of tired. He is still dialing, still hanging up, still closing the laptop early." },
      { speaker: "Narrator", text: "There were ups. There were downs that had you both reaching for the same sentence at 2 AM. You fought about the dishes, and about nothing, and about the dishes again. You made up badly and quickly and kept going." },
      { speaker: "Narrator", text: "And somewhere in the middle of all of it you got so good at each other that leaving would take more effort than staying." }
    ],
    next: "the_pets"
  },
  {
    id: "the_pets",
    bg: `
    ~    THE GUINEA PIGS    ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
          _  _  _  _  _  _   
         ( )( )( )( )( )( )  
          V  V  V  V  V  V   
           \  \  \  \  \     
            \  \  \  \  \    
             \__/  \__/  \__ 
    ~~~~~~~~~~~~~~~~~~~~~~~~~
         chaos   love   hay  
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "Then: Poro, Porkchop, Peanut, Snow, Pudding. Five guinea pigs. All of them loud, none of them quiet, one of them permanently plotting." },
      { speaker: "Narrator", text: "There were pups before them — tiny, loud, and briefly ours. They went off to their own homes with their own names, which is the only way to love something you are not allowed to keep." },
      { speaker: "Narrator", text: "And Bambi. The bunny. You loved Bambi once. You do not love Bambi now. Bambi knows exactly what it did, and Bambi is not sorry." },
      { speaker: "Narrator", text: "He sits in the corner of the room with the energy of a colleague you are contractually obliged to greet." }
    ],
    next: "staycation"
  }
];

// ============================================================
//  ACT III — THE FUTURE
//  She decides. Then the story runs out of road.
// ============================================================

const act3 = [
  {
    id: "staycation",
    bg: `
    ~      STAYCATION       ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    |                       |
    |    two days           |
    |    no shifts          |
    |    no dialer          |
    |    no plans           |
    |                       |
    |    you get to pick    |
    |                       |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "Next month. Two days off, booked and blocked out, defended from every coworker who thought they could have you." },
      { speaker: "Narrator", text: "He offered to plan it. You took the pen, because he would have booked a room next to the terminal and called it a treat." },
      { speaker: "Narrator", text: "Cubao, if you want a bed and a breakfast neither of you has to make. Home, if you want the couch and the pets and nowhere to be. A spa, if you want somebody else to be responsible for you for a few hours." },
      { speaker: "Narrator", text: "It is your call. He will pretend to have an opinion, and then agree with whatever you picked." }
    ],
    choices: [
      { text: "A hotel in Cubao - a bed, breakfast, and nowhere to be", next: "manila_hotel", affection: 3 },
      { text: "Stay home - the pets, the couch, zero plans", next: "stay_home", affection: 3 },
      { text: "A spa day - let somebody else take care of you", next: "spa_day", affection: 4 }
    ]
  },
  {
    id: "manila_hotel",
    bg: `
    ~       THE HOTEL       ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    | bed                   |
    | breakfast             |
    | no alarm              |
    | no dialer             |
    | no LOB                |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "A hotel in Cubao. Sheets nobody has to wash. A breakfast neither of you has to cook, in a city neither of you has to commute to." },
      { speaker: "Narrator", text: "You sleep until your body decides you are done. You eat standing up. You talk about the apartment you are not going to move and the cat you are never going to get." },
      { speaker: "Narrator", text: "There is a moment around hour six where neither of you reaches for a phone. You both notice it. Neither of you says it out loud." },
      { speaker: "Narrator", text: "It is not a fancy weekend. It is two adults with nowhere to be, and it is the most expensive nothing either of you has ever bought." }
    ],
    next: "ending"
  },
  {
    id: "stay_home",
    bg: `
    ~       STAY HOME       ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    |   []  []  []          |
    |   []  []  []          |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
      pets   couch   snacks  
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "Home. The herd loses its mind when the door opens, which is the best review this house gets all year." },
      { speaker: "Narrator", text: "You cook something ambitious and burn it. He orders backup and pretends he always meant to. You eat on the floor, because the table belongs to the guinea pigs now." },
      { speaker: "Narrator", text: "Bambi stays in the corner. Bambi is always in the corner. Bambi has a system." },
      { speaker: "Narrator", text: "You fall asleep on the couch at 1 AM with the TV on and someone's hand in yours, and wake at noon under a blanket neither of you remembers putting there." }
    ],
    next: "ending"
  },
  {
    id: "spa_day",
    bg: `
    ~        THE SPA        ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    +-----------------------+
    | quiet                 |
    | warm towels           |
    | no laptop             |
    | no asking how         |
    | she is feeling        |
    +-----------------------+
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "A spa day. You have spent two years being the one everybody calls, and you have decided to be the one everybody takes care of instead." },
      { speaker: "Narrator", text: "Three hours of being handled by a stranger, which turns out to be the one thing nobody lets you do at home." },
      { speaker: "Narrator", text: "He comes with you. He does not make small talk. He holds your bag and checks the room and sits in the chair by the door like a very patient airport escort." },
      { speaker: "Narrator", text: "You feel guilty for about four minutes. Then you do not — because he is looking at you like you cost him something to look at, and that is a language you only recently learned to read." }
    ],
    next: "ending"
  },
  {
    id: "ending",
    bg: `
    ~        THE END        ~
    ~~~~~~~~~~~~~~~~~~~~~~~~~
                             
    a story written in stars 
    and MS Teams messages    
    and five guinea pigs     
    and one rabbit nobody    
    likes very much          
    and two years            
    and one staycation       
    that has not happened yet
                             
    every choice was right   
    because every choice     
    led here                 
                             
    ~~~~~~~~~~~~~~~~~~~~~~~~~
    go be off-duty with her  
    ~~~~~~~~~~~~~~~~~~~~~~~~~
`,

    lines: [
      { speaker: "Narrator", text: "This is as far as the page goes." },
      { speaker: "Narrator", text: "The rest of it is still being written, and you are in it — whether you are pressing next or not." }
    ],
    next: null
  }
];
// Combine all acts
const story = [...act1, ...act2, ...act3];

// ============================================================
//  PARTICLES
// ============================================================

function initParticles() {
  const canvas = document.getElementById('particles');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  Game.particleCtx = canvas.getContext('2d');

  const colors = ['#ff6b9d', '#ffe066', '#ff9dc0', '#fff', '#ffd4e5'];
  Game.particles = [];

  for (let i = 0; i < 25; i++) {
    Game.particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speedY: -(Math.random() * 0.4 + 0.15),
      speedX: (Math.random() - 0.5) * 0.25,
      opacity: Math.random() * 0.4 + 0.1,
      color: colors[Math.floor(Math.random() * colors.length)],
      pulse: Math.random() * Math.PI * 2
    });
  }

  Game.particleInterval = setInterval(updateParticles, 50);
}

function updateParticles() {
  if (!Game.particleCtx) return;
  const canvas = document.getElementById('particles');
  const ctx = Game.particleCtx;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of Game.particles) {
    p.y += p.speedY;
    p.x += p.speedX;
    p.pulse += 0.02;

    if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
    if (p.x < -5) p.x = canvas.width + 5;
    if (p.x > canvas.width + 5) p.x = -5;

    const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  PETS — ASCII art that appears on frames
// ============================================================

const guineaPigArt = [
  "  _  _  _  ",
  " ( )( )( ) ",
  "  V  V  V  "
];

const guineaPigFull = [
  "   _  _  _  _  _  _  ",
  "  ( )( )( )( )( )( ) ",
  "   V  V  V  V  V  V  ",
  "    \\  \\  \\  \\  \\    ",
  "     \\  \\  \\  \\  \\  ",
  "      \\__/  \\__/  \\__"
];

const bunnyArt = [
  "   \\   /   ",
  "    \\ /    ",
  "    ( )    ",
  "   (   )   ",
  "  (     )  "
];

const petArt = [
  { name: "guinea pig", art: guineaPigArt },
  { name: "guinea pig", art: guineaPigFull },
  { name: "bunny", art: bunnyArt }
];

function spawnPet() {
  const layer = document.getElementById('pet-layer');
  if (!layer) return;

  const pet = petArt[Math.floor(Math.random() * petArt.length)];
  const el = document.createElement('div');
  el.className = 'pet-run';
  el.textContent = pet.art.join('\n');

  const startX = Math.random() > 0.5 ? -100 : layer.offsetWidth + 100;
  const startY = Math.random() * (layer.offsetHeight - 60) + 10;
  const endX = startX < 0 ? layer.offsetWidth + 100 : -100;

  el.style.left = startX + 'px';
  el.style.top = startY + 'px';

  layer.appendChild(el);

  setTimeout(() => {
    el.style.left = endX + 'px';
    el.style.top = (Math.random() * (layer.offsetHeight - 60) + 10) + 'px';
  }, 50);

  setTimeout(() => {
    el.remove();
  }, 4000);
}

function initPets() {
  Game.petInterval = setInterval(() => {
    if (Math.random() > 0.5) {
      spawnPet();
    }
  }, 3500);

  setTimeout(spawnPet, 1500);
}

// ============================================================
//  ENGINE
// ============================================================

function startGame() {
  const titleScreen = document.getElementById('title-screen');
  titleScreen.style.opacity = '0';
  setTimeout(() => {
    titleScreen.style.display = 'none';
    initParticles();
    initPets();
    loadScene(0);
  }, 1000);
}

function loadScene(sceneIndex) {
  if (sceneIndex >= story.length) return;
  Game.currentScene = sceneIndex;
  Game.currentLine = 0;
  Game.choicesVisible = false;
  Game.waitingForContinue = false;

  const scene = story[sceneIndex];
  document.getElementById('ascii-layer').textContent = scene.bg;
  showLine();
}

function showLine() {
  const scene = story[Game.currentScene];
  if (!scene || !scene.lines) return;

  if (Game.currentLine >= scene.lines.length) {
    if (scene.choices) {
      showChoices();
    } else if (scene.next) {
      Game.waitingForContinue = true;
    } else {
      Game.waitingForContinue = true;
    }
    return;
  }

  const line = scene.lines[Game.currentLine];
  typeText(line.speaker, line.text);
}

function typeText(speaker, text) {
  Game.typing = true;
  Game.waitingForContinue = false;

  document.getElementById('speaker').textContent = speaker + ':';
  const dialogueEl = document.getElementById('dialogue');
  dialogueEl.textContent = '';

  let i = 0;
  clearInterval(Game.typeTimer);
  Game.typeTimer = setInterval(() => {
    if (i < text.length) {
      dialogueEl.textContent += text[i];
      i++;
    } else {
      clearInterval(Game.typeTimer);
      Game.typing = false;
      Game.waitingForContinue = true;
    }
  }, 22);
}

function showChoices() {
  const scene = story[Game.currentScene];
  Game.choicesVisible = true;
  Game.selectedChoice = 0;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';

  scene.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="key-hint">[${i + 1}]</span> ${choice.text}`;
    btn.onclick = (e) => { e.stopPropagation(); pickChoice(i); };
    btn.onmouseenter = () => { Game.selectedChoice = i; updateChoiceSelection(); };
    choicesEl.appendChild(btn);
  });

  updateChoiceSelection();
}

function updateChoiceSelection() {
  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === Game.selectedChoice);
  });
}

function pickChoice(index) {
  const scene = story[Game.currentScene];
  const choice = scene.choices[index];
  if (!choice) return;

  Game.affection += choice.affection || 0;
  Game.choicesVisible = false;
  document.getElementById('choices').innerHTML = '';

  Game.finalChoice = choice.text;

  const nextIndex = resolveNext(choice.next, Game.currentScene);
  if (nextIndex !== -1) {
    transitionTo(nextIndex);
  }
}

function findSceneIndex(sceneId) {
  return story.findIndex(s => s.id === sceneId);
}

// Safety net: if a scene's `next` id does not exist in the story, fall back to
// the following scene in the array instead of silently stalling the whole story.
function resolveNext(sceneId, fromIndex) {
  const found = findSceneIndex(sceneId);
  if (found !== -1) return found;
  if (fromIndex != null && story[fromIndex + 1]) {
    console.warn('[story] broken link "' + sceneId + '" after "' + story[fromIndex].id +
                 '" — falling back to "' + story[fromIndex + 1].id + '"');
    return fromIndex + 1;
  }
  return -1;
}

function transitionTo(sceneIndex) {
  const fade = document.getElementById('fade-layer');
  fade.style.opacity = '1';

  setTimeout(() => {
    loadScene(sceneIndex);
    fade.style.opacity = '0';
  }, 650);
}

function advance() {
  if (Game.typing) {
    clearInterval(Game.typeTimer);
    const scene = story[Game.currentScene];
    const line = scene.lines[Game.currentLine];
    document.getElementById('dialogue').textContent = line.text;
    Game.typing = false;
    Game.waitingForContinue = true;
    return;
  }

  if (!Game.waitingForContinue || Game.choicesVisible) return;

  const scene = story[Game.currentScene];
  Game.currentLine++;
  Game.waitingForContinue = false;

  if (Game.currentLine >= scene.lines.length) {
    if (scene.choices) {
      showChoices();
    } else if (scene.next) {
      const nextIndex = resolveNext(scene.next, Game.currentScene);
      if (nextIndex !== -1) transitionTo(nextIndex);
    } else {
      Game.waitingForContinue = false;
      showSecretMessage();
    }
  } else {
    showLine();
  }
}

// ============================================================
//  SECRET MESSAGE — for him to find
// ============================================================

function showSecretMessage() {
  const layer = document.getElementById('pet-layer');
  const msg = document.createElement('div');
  msg.style.cssText = `
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255, 107, 157, 0.15);
    border: 1px solid rgba(255, 107, 157, 0.3);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: #ff9dc0;
    font-family: 'VT323', monospace;
    pointer-events: none;
  `;
  msg.innerHTML = `She picked: <strong>${Game.finalChoice || 'somewhere in particular'}</strong>`;
  layer.appendChild(msg);

  setTimeout(() => { msg.style.opacity = '0'; msg.style.transition = 'opacity 1s'; }, 8000);
  setTimeout(() => { msg.remove(); }, 9500);
}

// ============================================================
//  INPUT — Keyboard + Touch
// ============================================================

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    advance();
  }

  if (Game.choicesVisible) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      Game.selectedChoice = Math.max(0, Game.selectedChoice - 1);
      updateChoiceSelection();
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      e.preventDefault();
      const scene = story[Game.currentScene];
      Game.selectedChoice = Math.min(scene.choices.length - 1, Game.selectedChoice + 1);
      updateChoiceSelection();
    }
    if (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3') {
      const idx = parseInt(e.code.replace('Digit', '')) - 1;
      pickChoice(idx);
    }
  }
});

let touchStartY = 0;
let touchStartX = 0;

document.getElementById('screen').addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('screen').addEventListener('touchend', (e) => {
  const touchEndY = e.changedTouches[0].clientY;
  const touchEndX = e.changedTouches[0].clientX;
  const diffY = touchEndY - touchStartY;
  const diffX = touchEndX - touchStartX;

  if (Math.abs(diffY) > 50 && Math.abs(diffY) > Math.abs(diffX)) {
    if (diffY < 0 && Game.choicesVisible) {
      Game.selectedChoice = Math.max(0, Game.selectedChoice - 1);
      updateChoiceSelection();
    } else if (diffY > 0 && Game.choicesVisible) {
      const scene = story[Game.currentScene];
      Game.selectedChoice = Math.min(scene.choices.length - 1, Game.selectedChoice + 1);
      updateChoiceSelection();
    }
  } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
    if (!Game.choicesVisible) {
      advance();
    }
  }
}, { passive: true });

document.getElementById('screen').addEventListener('click', (e) => {
  if (!Game.choicesVisible && e.target.tagName !== 'BUTTON') {
    advance();
  }
});
</script>
